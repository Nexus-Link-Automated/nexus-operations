name: Run test suites

on:
  pull_request:
    branches:
      - "preview"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The part of setup.sh this stack needs. The compose file reads apps/api/.env;
      # the key is generated per run and only exists on the runner.
      - name: Create API env file
        run: |
          cp apps/api/.env.example apps/api/.env
          echo "SECRET_KEY=\"$(openssl rand -hex 25)\"" >> apps/api/.env

      - name: Run pytest in the test stack
        run: docker compose -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from api-tests

      - name: Tear down the test stack
        if: always()
        run: docker compose -f docker-compose-test.yml down -v --rmi local

  test-web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      # Corepack uses the pnpm version pinned by packageManager in package.json.
      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs every package with a test script, not just the affected ones, and
      # keeps going after a failure so one run reports all failing packages.
      # One package at a time: some DOM tests take a few seconds on their own and
      # hit vitest's 5s per-test timeout when packages compete for the runner's CPU.
      - name: Run unit tests
        run: pnpm turbo run test --continue=dependencies-successful --concurrency=1
