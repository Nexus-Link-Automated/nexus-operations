name: Build Hybrid Deployment Images

# Publishes every image for the Railway + VPS deployment under one tag, so the
# frontend and backend versions cannot drift apart. Railway rejects cache mounts
# unless their id contains a literal service id, so it cannot build Plane's
# Dockerfiles itself. It pulls these images instead.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag or commit of the Plane code to build"
        required: true
        default: "v1.4.3"
        type: string
      tag:
        description: "Image tag to publish (defaults to ref)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/nexus-link-automated
  IMAGE_TAG: ${{ inputs.tag || inputs.ref }}

jobs:
  plane:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: plane-frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - image: plane-admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - image: plane-space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - image: plane-live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - image: plane-backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The router config lives on this branch, not in the Plane release being built.
  router:
    name: plane-hybrid-router
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./deployments/hybrid/railway/router
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/plane-hybrid-router:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
